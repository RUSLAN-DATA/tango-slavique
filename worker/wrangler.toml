name = "tango-slavique-api"
main = "src/index.ts"
compatibility_date = "2026-09-17"

# Secrets (TELEGRAM_BOT_TOKEN, TELEGRAM_ADMIN_IDS, TELEGRAM_ADMIN_CHAT_ID,
# TELEGRAM_WEBHOOK_SECRET, GEMINI_API_KEY) are set in the Cloudflare dashboard
# / `wrangler secret`. Never put them here.

[vars]
MINIAPP_URL = "https://tango.bavariagloss.de/miniapp"
APP_ORIGIN = "https://tango.bavariagloss.de"
TELEGRAM_BOT_USERNAME = "Tangoslavique_bot"

[[d1_databases]]
binding = "DB"
database_name = "tango-slavique"
database_id = "7a28698f-c6e0-46f0-93d5-8ee85bbf13a2"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "tango-slavique-photos"
